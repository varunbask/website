<!DOCTYPE html>
<html lang="en" data-theme="dark"> <!-- Defaulting to dark for tutor view -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF8F5">
  <title>Tutor Dashboard | VP Education Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../submissions/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="../index.html" aria-label="VP Education Group">
        <span class="wordmark-mark" aria-hidden="true">VP</span>
        <span class="wordmark-text"><em>Education Group</em></span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">Site Home</a>
        <a href="#" id="logout-btn">Log out</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-intro" style="grid-column: 1 / -1;">
          <h1>Tutor Dashboard</h1>
          <p class="hero-line">Manage and grade pending submissions.</p>
        </div>
      </div>
    </section>

    <section class="section-inner">
      <div class="dashboard-controls">
        <h2 class="mono">Pending Submissions</h2>
        <button id="refresh-btn" class="btn btn-primary">Refresh List</button>
      </div>

      <div id="submissions-list" class="submissions-container">
        <!-- Loading state -->
        <p class="mono" id="loading-msg">Loading submissions...</p>
        <!-- List will be populated here -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 VP Education Group - Internal</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../app-config.js"></script>
  <script src="../app-auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
