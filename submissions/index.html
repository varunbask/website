<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF8F5">
  <title>Submit Homework | VP Education Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="../index.html" aria-label="VP Education Group">
        <span class="wordmark-mark" aria-hidden="true">VP</span>
        <span class="wordmark-text"><em class="i18n-w">Education Group</em></span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-intro" style="grid-column: 1 / -1;">
          <h1>Submit Homework</h1>
          <p class="hero-line">Please upload your completed assignment below.</p>
        </div>
      </div>
    </section>

    <section class="section-inner" style="max-width: 600px; margin: 0 auto 88px;">
      <div class="submission-card">
        <form id="submission-form">
          <div class="form-group">
            <label for="homework_file" class="mono">Assignment File</label>
            <input type="file" id="homework_file" name="file" accept=".pdf,.png,.jpg,.jpeg,.txt" required>
          </div>

          <div class="form-group">
            <label for="notes" class="mono">Additional Notes (optional)</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Anything the tutor should know..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" id="submit-btn">Submit Assignment</button>
        </form>
        <div id="form-message" class="form-message" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 VP Education Group</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../app-config.js"></script>
  <script src="../app-auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
