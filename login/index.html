<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF8F5">
  <title>Log in | VP Education Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    /* Same theme the visitor had on the main site: light unless dark was chosen. */
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("vb-theme"); } catch (e) { /* storage blocked */ }
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../submissions/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="../index.html" aria-label="VP Education Group">
        <span class="wordmark-mark" aria-hidden="true">VP</span>
        <span class="wordmark-text"><em>Education Group</em></span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section-inner login-wrap">
      <div class="submission-card">
        <h1 class="login-title">Log in</h1>

        <div id="login-panel">
          <div class="role-toggle" role="radiogroup" aria-label="Sign in as">
            <label><input type="radio" name="role" value="student" checked><span>Student</span></label>
            <label><input type="radio" name="role" value="tutor"><span>Tutor</span></label>
          </div>
          <p class="login-hint" id="login-hint">Sign in to submit your homework.</p>

          <form id="login-form">
            <div class="form-group">
              <label for="login-email" class="mono">Email</label>
              <input type="email" id="login-email" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="login-password" class="mono">Password</label>
              <input type="password" id="login-password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">Sign in as student</button>
          </form>
          <div class="form-message error" id="login-message" role="alert" hidden></div>
        </div>

        <div id="signed-in-panel" class="signed-in" hidden>
          <p>You are signed in as <strong id="signed-in-email"></strong>.</p>
          <a class="btn btn-primary" id="continue-btn" href="../submissions/">Go to homework submission</a>
          <button type="button" class="text-link link-button" id="sign-out-btn">Sign out and use a different account</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 VP Education Group</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../app-config.js"></script>
  <script src="../app-auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
